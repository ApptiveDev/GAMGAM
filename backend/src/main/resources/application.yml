spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: gamgam-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  servlet:
    context-path: /

app:
  media:
    base-url: ${MEDIA_BASE_URL:http://localhost:8080}
  places:
    kakao-key: ${KAKAO_REST_API_KEY:}
  weather:
    enabled: ${WEATHER_ENABLED:false}
