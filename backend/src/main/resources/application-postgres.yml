spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gamgam}
    username: ${DB_USERNAME:gamgam}
    password: ${DB_PASSWORD:gamgam}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-change-me-please-1234567890}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  cors:
    allowed-origins:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
