spring:
  datasource:
    # h2가 PostgreSQL처럼 동작 (이후 PostgreSQL 확장 대비)
    url: jdbc:h2:mem:gamgam;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

app:
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-change-me-please-1234567890}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  cors:
    allowed-origins:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
  #  생성할 공유 링크 주소(프론트엔드)
  share:
    base-url: http://localhost:3000
